# Preserve source snapshots byte-for-byte rather than applying research style.
exclude: ^(define-parallel-particle-operations|literal-c)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: trailing-whitespace
        exclude: '\.patch$'
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: bazel-tests
        name: Bazel tests
        entry: bazelisk test --noshow_progress --ui_event_filters=-info //...
        language: system
        pass_filenames: false
        always_run: true
      - id: basedpyright
        name: Basedpyright
        entry: uv run --frozen basedpyright
        language: system
        pass_filenames: false
        always_run: true
